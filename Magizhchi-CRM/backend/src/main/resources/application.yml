# Railway/most PaaS inject PORT; fall back to SERVER_PORT, then 8080 locally.
server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework  # honor X-Forwarded-* behind Railway's proxy

spring:
  application:
    name: magizhchi-crm
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/magizhchi_crm}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    # Override in production via APP_JWT_SECRET (Base64, >= 256 bits)
    secret: ${APP_JWT_SECRET:ZmFrZS1kZXYtc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLW1hZ2l6aGNoaQ==}
    access-token-ttl-minutes: ${APP_JWT_ACCESS_TTL:120}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    software.magizhchi.crm: INFO
