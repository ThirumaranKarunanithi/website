# Local dev dependencies for Magizhchi CRM.
# Brings up PostgreSQL (and Redis, used from the notifications phase onward).
#   docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: magizhchi-crm-db
    environment:
      POSTGRES_DB: magizhchi_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d magizhchi_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: magizhchi-crm-redis
    ports:
      - "6379:6379"

volumes:
  crm_pgdata:
